<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e50914"/>
      <stop offset="100%" style="stop-color:#b20710"/>
    </linearGradient>
    <linearGradient id="film" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#ddd;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Film reel circle -->
  <circle cx="256" cy="240" r="120" fill="none" stroke="url(#film)" stroke-width="18" opacity="0.9"/>
  <circle cx="256" cy="240" r="40" fill="url(#film)" opacity="0.9"/>
  <!-- Film holes -->
  <circle cx="256" cy="135" r="14" fill="url(#film)" opacity="0.8"/>
  <circle cx="256" cy="345" r="14" fill="url(#film)" opacity="0.8"/>
  <circle cx="151" cy="240" r="14" fill="url(#film)" opacity="0.8"/>
  <circle cx="361" cy="240" r="14" fill="url(#film)" opacity="0.8"/>
  <circle cx="181" cy="165" r="12" fill="url(#film)" opacity="0.7"/>
  <circle cx="331" cy="165" r="12" fill="url(#film)" opacity="0.7"/>
  <circle cx="181" cy="315" r="12" fill="url(#film)" opacity="0.7"/>
  <circle cx="331" cy="315" r="12" fill="url(#film)" opacity="0.7"/>
  <!-- Play button -->
  <polygon points="236,200 236,280 300,240" fill="#e50914" opacity="0.9"/>
  <!-- Text -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="56" fill="white" letter-spacing="4">CINEMA</text>
  <text x="256" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-weight="400" font-size="28" fill="rgba(255,255,255,0.7)" letter-spacing="8">SERMOVIE</text>
</svg>
